name: Native toolchain cache
on:
  push:
    branches: ['dev/**']
    paths: ['.github/workflows/native-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-linux-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch and verify exact official archive
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request
          lock = json.loads(pathlib.Path('toolchain.lock.json').read_text())
          meta = lock['platforms']['linux']
          url = 'https://github.com/godotengine/godot-builds/releases/download/' + lock['release_tag'] + '/' + meta['archive']
          with urllib.request.urlopen(url, timeout=60) as response:
              raw = response.read(128 * 1024 * 1024 + 1)
          if len(raw) > 128 * 1024 * 1024 or hashlib.sha256(raw).hexdigest() != meta['sha256']:
              raise RuntimeError('Official engine archive checksum/size mismatch')
          pathlib.Path('toolchain-cache').mkdir()
          pathlib.Path('toolchain-cache/engine.zip').write_bytes(raw)
          pathlib.Path('toolchain-cache/lock.json').write_text(json.dumps(lock))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-godot-4.6.1-linux-toolchain
          path: toolchain-cache/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
