name: Ruleweaver Preflight

on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruleweaver-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  offline:
    name: Offline contracts and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q tools tests
      - name: Offline checks (not a Godot verdict)
        run: python tools/run_checks.py --offline-only --reports reports/current
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ github.sha }}
          path: reports/current/
          retention-days: 7
          if-no-files-found: error

  native:
    name: Godot 4.6.1 native (${{ matrix.os }})
    needs: offline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install checksum-pinned official engine
        run: python tools/install_godot.py --destination "${{ runner.temp }}/ruleweaver-godot"
      - name: Native components and lifecycle
        run: python tools/run_checks.py --native-only --reports reports/current
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          path: reports/current/
          retention-days: 7
          if-no-files-found: warn
      - name: Package Windows development launcher after native checks
        if: matrix.os == 'windows-latest'
        run: python tools/package_desktop.py --output packages --commit "${{ github.sha }}"
      - name: Upload playable development launcher
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playable-windows-${{ github.sha }}
          path: packages/
          retention-days: 7
          if-no-files-found: error
